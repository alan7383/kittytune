name: Full Android compilation

on:
  push:
    branches: [perf/android-ui-stalls]
    paths: ['.github/workflows/android-compile.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assemble-debug:
    name: Compile Android and Wear debug APKs
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install the project Android toolchain
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" --licenses <<< "$(printf 'y\n%.0s' {1..100})"
          "$SDKMANAGER" --install \
            "platforms;android-37.2" \
            "build-tools;37.0.0" \
            "ndk;27.1.12297006" \
            "cmake;3.22.1"
      - name: Compile all debug variants including native libraries
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --console=plain --no-daemon --max-workers=2 \
            '-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8' \
            -Pkotlin.compiler.execution.strategy=in-process 2>&1 | tee android-compile.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-compile-log
          path: android-compile.log
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: android-debug-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            wear/build/outputs/apk/debug/*.apk
          compression-level: 0
          retention-days: 7
