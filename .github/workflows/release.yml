name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-22.04

    steps:
      # ── Checkout ────────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # required by git-cliff to walk the full history

      # ── Java ────────────────────────────────────────────────────────────────
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      # ── Android NDK ─────────────────────────────────────────────────────────
      - name: Setup Android NDK
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;27.1.12297006"

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      # ── Signing keystore ────────────────────────────────────────────────────
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > app/keystore.jks

      # ── Build signed APK ────────────────────────────────────────────────────
      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS:         ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD:      ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease -x lintVitalRelease --stacktrace \
            -Pandroid.injected.signing.store.file=$PWD/app/keystore.jks \
            -Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD \
            -Pandroid.injected.signing.key.alias=$KEY_ALIAS \
            -Pandroid.injected.signing.key.password=$KEY_PASSWORD

      # ── Changelog (git-cliff) ────────────────────────────────────────────────
      - name: Get previous tag
        id: prev_tag
        run: |
          # Find the closest tag in history before the current ref
          PREV=$(git describe --tags --abbrev=0 "${{ github.ref_name }}^" 2>/dev/null || echo "")
          echo "Previous tag found: $PREV"
          if [ -z "$PREV" ]; then
            echo "range=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "range=${PREV}..${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Generate changelog
        uses: orhun/git-cliff-action@v4
        id: cliff
        with:
          config: cliff.toml
          args: --strip header -- ${{ steps.prev_tag.outputs.range }}

      # ── GitHub Release ───────────────────────────────────────────────────────
      - name: Delete existing release if present
        run: gh release delete ${{ github.ref_name }} --yes || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Write changelog to file
        run: echo "${{ steps.cliff.outputs.content }}" > CHANGELOG_RELEASE.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "KittyTune ${{ github.ref_name }}"
          body_path: CHANGELOG_RELEASE.md
          files: app/build/outputs/apk/release/*.apk
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── Discord Release Notification ────────────────────────────────────────
      - name: Send Discord Release Notification
        if: success()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          python3 - << 'EOF'
          import os, json, urllib.request

          webhook_url = os.environ.get("DISCORD_WEBHOOK")
          if not webhook_url:
              print("No DISCORD_RELEASE_WEBHOOK configured, skipping.")
              exit(0)

          tag = os.environ.get("TAG_NAME", "")
          release_url = f"https://github.com/alan7383/kittytune/releases/tag/{tag}"

          changelog = ""
          if os.path.exists("CHANGELOG_RELEASE.md"):
              with open("CHANGELOG_RELEASE.md", "r", encoding="utf-8") as f:
                  changelog = f.read().strip()

          if len(changelog) > 1500:
              changelog = changelog[:1490] + "\n\n... *(full changelog on GitHub)*"

          payload = {
              "content": f"<@&1552727930801627166> **(=^･ω･^=) KittyTune {tag} is now available!**",
              "allowed_mentions": {
                  "roles": ["1552727930801627166"]
              },
              "embeds": [
                  {
                      "title": f"KittyTune {tag}",
                      "url": release_url,
                      "description": changelog if changelog else f"KittyTune {tag} has been released!",
                      "color": 16742005,
                      "fields": [
                          {
                              "name": "✦ Download APK",
                              "value": f"[GitHub Releases & Assets]({release_url})",
                              "inline": False
                          }
                      ],
                      "footer": {
                          "text": "KittyTune • Automated Release Pipeline"
                      }
                  }
              ]
          }

          req = urllib.request.Request(
              webhook_url,
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Content-Type": "application/json",
                  "User-Agent": "GitHub-Actions-Release-Notifier"
              }
          )
          try:
              with urllib.request.urlopen(req) as resp:
                  print("Discord notification sent! Status:", resp.status)
          except Exception as e:
              print("Failed to send Discord notification:", e)
          EOF
